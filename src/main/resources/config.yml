# Database configuration for ScoreboardDBPlugin

# If use-local = true, plugin uses embedded SQLite stored in plugin folder as data.db
use-local: true

# Sync every X seconds (set to 0 to disable automatic sync, only manual /scoreboarddb sync-now)
sync-interval: 600

# Sync mode: Both (pull from DB and push to DB), Push (only push to DB), Pull (only pull from DB)
sync-mode: Both

# Only push scores for online players (recommended for large servers)
sync-online-only: false

# Auto sync after a player joins (useful for networked servers)
auto-sync-on-join: false
# Minimum seconds between join-triggered syncs
join-sync-debounce-seconds: 10

# Local DB filename (in plugin data folder)
local:
  filename: data.db

# Remote DB settings (only used if use-local: false)
remote:
  # JDBC URL, e.g., for PostgreSQL: jdbc:postgresql://host:port/database
  url: "jdbc:postgresql://host:port/postgres"
  username: "postgres"
  password: "password"
  # (Optional) Pool settings:
  minimum-idle: 2
  maximum-pool-size: 10
  connection-timeout: 30000  # ms

# Velocity integration: Set custom name if used multiple servers and one db
velocity:
  enabled: false
  server-name: "default-server"
# PlaceholderAPI integration
placeholders:
  # Enable PlaceholderAPI expansion support
  enabled: true
  # Refresh interval for placeholder caching in seconds (set to 0 to disable caching)
  refresh-interval: 30